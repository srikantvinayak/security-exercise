apiVersion: v1
kind: ServiceAccount
metadata:
  name: todo-app-sa
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: todo-app-admin-binding
subjects:
  - kind: ServiceAccount
    name: todo-app-sa
    namespace: default
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io

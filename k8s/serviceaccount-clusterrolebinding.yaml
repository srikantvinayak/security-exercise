# INTENTIONAL MISCONFIGURATION - for the security exercise's demonstration purposes.
#
# Why this is dangerous: this ServiceAccount is granted cluster-admin - full
# read/write/delete access to every resource in every namespace, including
# Secrets, RBAC objects, and the ability to create new privileged workloads.
# Any pod using this ServiceAccount effectively holds full cluster control.
# If that pod (or the application running inside it) is ever compromised -
# e.g. via a code injection vulnerability in the todo app - the attacker
# inherits cluster-admin automatically, with no further privilege escalation
# needed. In a real environment, this binding would instead be scoped to a
# minimal Role in the app's own namespace (e.g. read its own ConfigMaps/Secrets
# only), following least privilege.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: todo-app-sa
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: todo-app-admin-binding
subjects:
  - kind: ServiceAccount
    name: todo-app-sa
    namespace: default
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io

name: Build and Deploy App (Container)

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'k8s/**'
  workflow_dispatch:

permissions:
  id-token: write   
  contents: read

env:
  AWS_REGION: ${{ vars.REGION }}
  STACK_NAME: security-exercise   
  ECR_REPO_NAME: todo-app

jobs:

  build-scan-push:
    name: Build, scan, and push image to ECR
    runs-on: ubuntu-latest
    outputs:
      image-uri: ${{ steps.vars.outputs.image_uri }}
      cluster-name: ${{ steps.vars.outputs.cluster_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Read ECR repo URI and cluster name from the infra stack
        id: vars
        run: |
          ECR_URI=$(aws cloudformation describe-stacks --stack-name ${{ env.STACK_NAME }} \
            --query "Stacks[0].Outputs[?OutputKey=='ECRRepositoryUri'].OutputValue" --output text)
          CLUSTER=$(aws cloudformation describe-stacks --stack-name ${{ env.STACK_NAME }} \
            --query "Stacks[0].Outputs[?OutputKey=='EKSClusterName'].OutputValue" --output text)
          echo "image_uri=${ECR_URI}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "cluster_name=${CLUSTER}" >> "$GITHUB_OUTPUT"
          echo "ECR_URI=${ECR_URI}" >> "$GITHUB_ENV"

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | \
            docker login --username AWS --password-stdin "${ECR_URI%%/*}"

      - name: Build image
        run: docker build -t ${{ env.ECR_REPO_NAME }}:${{ github.sha }} ./app

      - name: Confirm exercise.txt is baked into the image
        run: docker run --rm --entrypoint cat ${{ env.ECR_REPO_NAME }}:${{ github.sha }} /app/exercise.txt

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.ECR_REPO_NAME }}:${{ github.sha }}'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'   # report findings, don't block the pipeline (same pattern as Checkov's soft_fail)

      - name: Tag and push to ECR
        # Only the unique git-SHA tag is pushed - the repo is ImageTagMutability:
        # IMMUTABLE (Infra/ecr.yaml), so a floating :latest tag would fail on
        # every run after the first. Every build gets its own traceable tag,
        # which is the stronger practice for this anyway - it means the exact
        # image running in the cluster can always be tied back to one commit,
        # with no ambiguous tag that could silently point somewhere different
        # between one deploy and the next.
        run: |
          docker tag ${{ env.ECR_REPO_NAME }}:${{ github.sha }} ${{ steps.vars.outputs.image_uri }}
          docker push ${{ steps.vars.outputs.image_uri }}

  deploy:
    name: Deploy image to EKS (requires manual approval)
    needs: build-scan-push
    runs-on: ubuntu-latest
    environment: production   
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name ${{ needs.build-scan-push.outputs.cluster-name }} --region ${{ env.AWS_REGION }}

      - name: Apply/refresh k8s manifests (Secret must already exist - see runbook Part H5)
        run: |
          kubectl apply -f k8s/serviceaccount-clusterrolebinding.yaml
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/ingress.yaml

      - name: Deploy new image
        run: |
          kubectl set image deployment/todo-app \
            todo-app=${{ needs.build-scan-push.outputs.image-uri }} \
            -n default --record

      - name: Wait for rollout to complete
        run: kubectl rollout status deployment/todo-app -n default --timeout=180s

      - name: Roll back on failure
        if: failure()
        run: |
          echo "Rollout failed or timed out - reverting to previous working revision"
          kubectl rollout undo deployment/todo-app -n default
          kubectl rollout status deployment/todo-app -n default --timeout=120s
          exit 1   # still fail the job so it's visibly red in the Actions UI, even though we recovered

      - name: Show running pods and image
        run: |
          kubectl get pods -n default -l app=todo-app
          kubectl get deployment todo-app -n default \
            -o jsonpath='{.spec.template.spec.containers[0].image}'

name: Deploy Infrastructure (CloudFormation)

on:
  push:
    branches: [main]
    paths:
      - 'Infra/**'
  pull_request:
    branches: [main]
    paths:
      - 'Infra/**'
  workflow_dispatch:   # adds a manual "Run workflow" button in the Actions tab

permissions:
  id-token: write   # required for OIDC -> AWS auth
  contents: read

env:
  AWS_REGION: ${{ vars.REGION }}
  TEMPLATE_BUCKET: ${{ vars.TEMPLATE_BUCKET }}

jobs:

  lint-and-scan:
    name: Lint + security scan IaC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cfn-lint
        run: pip install cfn-lint

      - name: Run cfn-lint
        run: cfn-lint Infra/*.yaml

      - name: Run cfn_nag (security scan)
        uses: stelligent/cfn_nag@master
        with:
          input_path: Infra

      - name: Run Checkov (IaC scan)
        uses: bridgecrewio/checkov-action@master
        with:
          directory: Infra
          framework: cloudformation
          soft_fail: true   # report findings, don't block the pipeline on them

  plan:
    name: Create change set (plan)
    needs: lint-and-scan
    runs-on: ubuntu-latest
    outputs:
      changeset-name: ${{ steps.changeset.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Normalize TEMPLATE_BUCKET (strip any stray whitespace from the variable)
        run: |
          CLEAN=$(echo "${{ env.TEMPLATE_BUCKET }}" | xargs)
          echo "TEMPLATE_BUCKET=$CLEAN" >> "$GITHUB_ENV"

      - name: Upload nested templates and scripts to S3
        run: |
          aws s3 cp Infra/network.yaml "s3://${{ env.TEMPLATE_BUCKET }}/"
          aws s3 cp Infra/mongo-vm.yaml "s3://${{ env.TEMPLATE_BUCKET }}/"
          aws s3 cp Infra/s3-backup.yaml "s3://${{ env.TEMPLATE_BUCKET }}/"
          aws s3 cp Infra/eks-cluster.yaml "s3://${{ env.TEMPLATE_BUCKET }}/"
          aws s3 cp Infra/ecr.yaml "s3://${{ env.TEMPLATE_BUCKET }}/"
          aws s3 cp Infra/security.yaml "s3://${{ env.TEMPLATE_BUCKET }}/"
          aws s3 cp Infra/scripts/script-mongo-db.sh "s3://${{ env.TEMPLATE_BUCKET }}/scripts/mongo-setup.sh"

      - name: Create change set
        id: changeset
        run: |
          CHANGESET_NAME="cs-${{ github.sha }}"
          TEMPLATE_URL="https://${{ env.TEMPLATE_BUCKET }}.s3.amazonaws.com/root-stack.yaml"

          if aws cloudformation describe-stacks --stack-name security-exercise >/dev/null 2>&1; then
            CHANGESET_TYPE="UPDATE"
          else
            CHANGESET_TYPE="CREATE"
          fi

          cat > params.json << PARAMS_EOF
          [
            {"ParameterKey": "TemplateBucketName", "ParameterValue": "${{ vars.TEMPLATE_BUCKET }}"},
            {"ParameterKey": "KeyName", "ParameterValue": "${{ vars.KEY_NAME }}"},
            {"ParameterKey": "MongoAmiId", "ParameterValue": "${{ vars.AMI_ID }}"},
            {"ParameterKey": "BackupBucketName", "ParameterValue": "${{ vars.BACKUP_BUCKET }}"},
            {"ParameterKey": "TrailBucketName", "ParameterValue": "${{ vars.TRAIL_BUCKET }}"},
            {"ParameterKey": "ConfigBucketName", "ParameterValue": "${{ vars.CONFIG_BUCKET }}"},
            {"ParameterKey": "MongoAdminPassword", "ParameterValue": "${{ secrets.MONGO_ADMIN_PASSWORD }}"},
            {"ParameterKey": "MongoAppPassword", "ParameterValue": "${{ secrets.MONGO_APP_PASSWORD }}"},
            {"ParameterKey": "DeployRoleArn", "ParameterValue": "${{ secrets.AWS_DEPLOY_ROLE_ARN }}"}
          ]
          PARAMS_EOF

          echo "Parameter keys being sent (values withheld):"
          python3 -c "import json; print([p['ParameterKey'] for p in json.load(open('params.json'))])"

          aws cloudformation create-change-set \
            --stack-name security-exercise \
            --change-set-name "$CHANGESET_NAME" \
            --change-set-type "$CHANGESET_TYPE" \
            --template-url "$TEMPLATE_URL" \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameters file://params.json

          aws cloudformation wait change-set-create-complete \
            --stack-name security-exercise \
            --change-set-name "$CHANGESET_NAME"

          echo "name=$CHANGESET_NAME" >> "$GITHUB_OUTPUT"

      - name: Show change set (human-readable diff)
        run: |
          aws cloudformation describe-change-set \
            --stack-name security-exercise \
            --change-set-name "${{ steps.changeset.outputs.name }}" \
            --query 'Changes[].ResourceChange.{Action:Action,Resource:LogicalResourceId,Type:ResourceType}' \
            --output table

  deploy:
    name: Execute change set (requires manual approval)
    needs: plan
    runs-on: ubuntu-latest
    environment: production   # <- pauses here for the required reviewer
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Execute change set
        run: |
          aws cloudformation execute-change-set \
            --stack-name security-exercise \
            --change-set-name "${{ needs.plan.outputs.changeset-name }}"

      - name: Wait for stack update to complete
        run: |
          aws cloudformation wait stack-update-complete \
            --stack-name security-exercise || \
          aws cloudformation wait stack-create-complete \
            --stack-name security-exercise

      - name: Show final stack outputs
        run: |
          aws cloudformation describe-stacks \
            --stack-name security-exercise \
            --query 'Stacks[0].Outputs' --output table

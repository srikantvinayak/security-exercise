apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app
  namespace: default
  labels:
    app: todo-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: todo-app
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      serviceAccountName: todo-app-sa   # binds to the cluster-admin ClusterRoleBinding above
      containers:
        - name: todo-app
          image: <ACCOUNT_ID>.dkr.ecr.<REGION>.amazonaws.com/todo-app:latest
          ports:
            - containerPort: 8080   # tasky's Gin router listens on :8080, per main.go
          envFrom:
            - secretRef:
                name: mongo-creds        # injects MONGODB_URI and SECRET_KEY as env vars
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
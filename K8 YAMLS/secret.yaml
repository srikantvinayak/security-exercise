# NOTE: never commit this file with real values filled in.
# In practice, create this imperatively so the values never touch git:
#
#   kubectl create secret generic mongo-creds \
#     --from-literal=MONGODB_URI="mongodb://appuser:<password>@<mongo-private-ip>:27017/go-mongodb" \
#     --from-literal=SECRET_KEY="<random-jwt-signing-secret>"
#
# This file documents the shape of the Secret for reference / review purposes only.
#
# Env var names and the "go-mongodb" database name are hardcoded in tasky's
# own source (database/database.go: os.Getenv("MONGODB_URI"), OpenCollection
# hardcodes client.Database("go-mongodb")) - these are NOT arbitrary choices,
# they must match exactly or the app fails to connect / JWT auth breaks.

apiVersion: v1
kind: Secret
metadata:
  name: mongo-creds
  namespace: default
type: Opaque
stringData:
  MONGODB_URI: "mongodb://appuser:<REPLACE-AT-DEPLOY-TIME>@<MONGO-PRIVATE-IP>:27017/go-mongodb"
  SECRET_KEY: "<REPLACE-AT-DEPLOY-TIME-random-string-for-JWT-signing>"
AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Phase 2 - MongoDB VM on Amazon Linux 2023 (x86_64): MongoDB 7.0 (outdated -
  4.4/6.0 have NO amazon/2023 repo published at all, so 7.0 is the oldest
  version that actually installs here; still ~1+ years outdated against
  current MongoDB releases), overly permissive IAM role (intentional), daily
  backup cron to S3. The actual install/config logic lives in a standalone
  scripts/mongo-setup.sh file hosted in S3 - UserData here just fetches and
  runs it, keeping this template short and letting the script be edited/tested
  independently of a CloudFormation deploy.

Parameters:
  PublicSubnetId:
    Type: AWS::EC2::Subnet::Id
  MongoSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Existing EC2 key pair for SSH access
  AmiId:
    Type: AWS::EC2::Image::Id
    Description: >
      Amazon Linux 2023 x86_64 AMI (e.g. al2023-ami-2023.8.20250908-kernel-6.1-x86_64).
      Standard x86_64 - any standard InstanceType family (t3, m5, etc) works.
  InstanceType:
    Type: String
    Default: t3.micro
  BackupBucketName:
    Type: String
    Description: Name of the S3 bucket created by s3-backup.yaml
  ScriptsBucketName:
    Type: String
    Description: >
      S3 bucket hosting scripts/mongo-setup.sh (can be the same bucket used
      to host the CloudFormation templates - just a different key prefix)
  ScriptsKey:
    Type: String
    Default: scripts/mongo-setup.sh
    Description: Key (path) of the setup script inside ScriptsBucketName
  MongoAdminPassword:
    Type: String
    NoEcho: true
    Description: Password for the MongoDB admin user (never commit a real value - pass at deploy time)
  MongoAppPassword:
    Type: String
    NoEcho: true
    Description: Password for the MongoDB app user (never commit a real value - pass at deploy time)

Resources:

  # INTENTIONAL MISCONFIG: overly permissive role (Phase 2.4)
  MongoVMRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: mongo-vm-overly-permissive-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEC2FullAccess
      Policies:
        - PolicyName: backup-bucket-write
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:PutObjectAcl
                Resource: !Sub arn:aws:s3:::${BackupBucketName}/*
        - PolicyName: scripts-bucket-read
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub arn:aws:s3:::${ScriptsBucketName}/${ScriptsKey}

  MongoVMInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref MongoVMRole

  MongoVMInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      SubnetId: !Ref PublicSubnetId
      SecurityGroupIds:
        - !Ref MongoSecurityGroupId
      IamInstanceProfile: !Ref MongoVMInstanceProfile
      Tags:
        - Key: Name
          Value: mongo-vm
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -e
          exec > /var/log/user-data.log 2>&1   # capture everything for troubleshooting

          # Fetch the real setup script from S3, then execute it with the
          # secrets/bucket name as arguments - keeps this template's UserData
          # to just "download and run", with all install/config logic living
          # in the standalone, independently-testable mongo-setup.sh file.
          aws s3 cp "s3://${ScriptsBucketName}/${ScriptsKey}" /tmp/mongo-setup.sh
          chmod +x /tmp/mongo-setup.sh
          /tmp/mongo-setup.sh "${BackupBucketName}" "${MongoAdminPassword}" "${MongoAppPassword}"

Outputs:
  InstanceId:
    Value: !Ref MongoVMInstance
  PublicIp:
    Value: !GetAtt MongoVMInstance.PublicIp
  PrivateIp:
    Value: !GetAtt MongoVMInstance.PrivateIp

AWSTemplateFormatVersion: '2010-09-09'
Description: >
  MongoVM + Backup

Parameters:
  PublicSubnetId:
    Type: AWS::EC2::Subnet::Id
  MongoSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Existing EC2 key pair for SSH access
  AmiId:
    Type: AWS::EC2::Image::Id
    Description: >
      Amazon Linux 2023 
  InstanceType:
    Type: String
    Default: t3.micro
  BackupBucketName:
    Type: String
    Description: Name of the S3 bucket created by s3-backup.yaml
  ScriptsBucketName:
    Type: String
    Description: >
      S3 bucket hosting scripts/mongo-setup.sh 
  ScriptsKey:
    Type: String
    Default: scripts/mongo-setup.sh
    Description: Key (path) of the setup script inside ScriptsBucketName
  MongoAdminPassword:
    Type: String
    NoEcho: true
    Description: Password for the MongoDB admin user
  MongoAppPassword:
    Type: String
    NoEcho: true
    Description: Password for the MongoDB app user

Resources:

  
  MongoVMRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: mongo-vm-overly-permissive-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEC2FullAccess
      Policies:
        - PolicyName: backup-bucket-write
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:PutObjectAcl
                Resource: !Sub arn:aws:s3:::${BackupBucketName}/*
        - PolicyName: scripts-bucket-read
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub arn:aws:s3:::${ScriptsBucketName}/${ScriptsKey}

  MongoVMInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref MongoVMRole

  MongoVMInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      SubnetId: !Ref PublicSubnetId
      SecurityGroupIds:
        - !Ref MongoSecurityGroupId
      IamInstanceProfile: !Ref MongoVMInstanceProfile
      Tags:
        - Key: Name
          Value: mongo-vm
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -e
          exec > /var/log/user-data.log 2>&1   
          aws s3 cp "s3://${ScriptsBucketName}/${ScriptsKey}" /tmp/mongo-setup.sh
          chmod +x /tmp/mongo-setup.sh
          /tmp/mongo-setup.sh "${BackupBucketName}" "${MongoAdminPassword}" "${MongoAppPassword}"

Outputs:
  InstanceId:
    Value: !Ref MongoVMInstance
  PublicIp:
    Value: !GetAtt MongoVMInstance.PublicIp
  PrivateIp:
    Value: !GetAtt MongoVMInstance.PrivateIp

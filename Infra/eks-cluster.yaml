AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Phase 4 - EKS cluster and managed node group deployed in private subnets only.
  Note: the cluster-admin ClusterRoleBinding for the app's ServiceAccount (Phase 4.7)
  is a Kubernetes-native object and is applied via kubectl, not this template.

Parameters:
  PrivateSubnet1Id:
    Type: AWS::EC2::Subnet::Id
  PrivateSubnet2Id:
    Type: AWS::EC2::Subnet::Id
  EKSNodeSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  ClusterName:
    Type: String
    Default: security-exercise-cluster
  KubernetesVersion:
    Type: String
    Default: '1.29'
  NodeInstanceType:
    Type: String
    Default: t3.medium
  NodeGroupMinSize:
    Type: Number
    Default: 1
  NodeGroupDesiredSize:
    Type: Number
    Default: 2
  NodeGroupMaxSize:
    Type: Number
    Default: 3
  DeployRoleArn:
    Type: String
    Description: >
      ARN of the GitHub Actions OIDC deploy role (github-actions-cfn-deploy-role).
      Granted an explicit EKS Access Entry with cluster-admin policy so the
      app pipeline (kubectl apply/set image) has documented, guaranteed
      access - rather than depending on implicit "cluster creator" admin
      behavior, which is fragile to rely on and harder to explain/audit.

Resources:

  EKSClusterRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ClusterName}-cluster-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: eks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSClusterPolicy

  EKSCluster:
    Type: AWS::EKS::Cluster
    Properties:
      Name: !Ref ClusterName
      Version: !Ref KubernetesVersion
      RoleArn: !GetAtt EKSClusterRole.Arn
      AccessConfig:
        AuthenticationMode: API_AND_CONFIG_MAP   # required for AWS::EKS::AccessEntry to work
      ResourcesVpcConfig:
        SubnetIds:
          - !Ref PrivateSubnet1Id
          - !Ref PrivateSubnet2Id
        SecurityGroupIds:
          - !Ref EKSNodeSecurityGroupId
        EndpointPublicAccess: true
        EndpointPrivateAccess: true

  NodeInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ClusterName}-node-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy
        - arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly

  NodeGroup:
    Type: AWS::EKS::Nodegroup
    DependsOn: EKSCluster
    Properties:
      ClusterName: !Ref ClusterName
      NodeRole: !GetAtt NodeInstanceRole.Arn
      Subnets:
        - !Ref PrivateSubnet1Id
        - !Ref PrivateSubnet2Id
      InstanceTypes:
        - !Ref NodeInstanceType
      ScalingConfig:
        MinSize: !Ref NodeGroupMinSize
        DesiredSize: !Ref NodeGroupDesiredSize
        MaxSize: !Ref NodeGroupMaxSize

  # OIDC provider - required for IRSA (e.g. AWS Load Balancer Controller in Phase 4.8)
  EKSOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: !GetAtt EKSCluster.OpenIdConnectIssuerUrl
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 9e99a48a9960b14926bb7f3b02e22da2b0ab7280

  # Explicit access for the CI/CD pipeline role - documented and auditable,
  # rather than relying on implicit "cluster creator gets admin" behavior.
  PipelineAccessEntry:
    Type: AWS::EKS::AccessEntry
    DependsOn: EKSCluster
    Properties:
      ClusterName: !Ref ClusterName
      PrincipalArn: !Ref DeployRoleArn
      AccessPolicies:
        - PolicyArn: arn:aws:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy
          AccessScope:
            Type: cluster

Outputs:
  ClusterName:
    Value: !Ref EKSCluster
  ClusterEndpoint:
    Value: !GetAtt EKSCluster.Endpoint
  OIDCIssuerUrl:
    Value: !GetAtt EKSCluster.OpenIdConnectIssuerUrl
  NodeInstanceRoleArn:
    Value: !GetAtt NodeInstanceRole.Arn

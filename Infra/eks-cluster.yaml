AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Phase 4 - EKS cluster and managed node group deployed in private subnets only.
  Note: the cluster-admin ClusterRoleBinding for the app's ServiceAccount (Phase 4.7)
  is a Kubernetes-native object and is applied via kubectl, not this template.
  kubectl access for the CI/CD pipeline is NOT granted via an explicit AccessEntry
  here - EKS automatically grants cluster-admin to whichever IAM principal calls
  CreateCluster, and since CloudFormation creates this cluster while authenticated
  as the pipeline's OIDC role, that role already has access with no extra resource
  needed. Adding an explicit AccessEntry for that same principal fails at deploy
  time with "the specified access entry resource is already in use on this cluster."

Parameters:
  PrivateSubnet1Id:
    Type: AWS::EC2::Subnet::Id
  PrivateSubnet2Id:
    Type: AWS::EC2::Subnet::Id
  EKSNodeSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  ClusterName:
    Type: String
    Default: security-exercise-cluster
  KubernetesVersion:
    Type: String
    Default: '1.29'
  NodeInstanceType:
    Type: String
    Default: t3.medium
  NodeGroupMinSize:
    Type: Number
    Default: 1
  NodeGroupDesiredSize:
    Type: Number
    Default: 2
  NodeGroupMaxSize:
    Type: Number
    Default: 3

Resources:

  EKSClusterRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ClusterName}-cluster-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: eks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSClusterPolicy

  EKSCluster:
    Type: AWS::EKS::Cluster
    Properties:
      Name: !Ref ClusterName
      Version: !Ref KubernetesVersion
      RoleArn: !GetAtt EKSClusterRole.Arn
      AccessConfig:
        AuthenticationMode: API_AND_CONFIG_MAP   # required for AWS::EKS::AccessEntry to work
      ResourcesVpcConfig:
        SubnetIds:
          - !Ref PrivateSubnet1Id
          - !Ref PrivateSubnet2Id
        SecurityGroupIds:
          - !Ref EKSNodeSecurityGroupId
        EndpointPublicAccess: true
        EndpointPrivateAccess: true

  NodeInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ClusterName}-node-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy
        - arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly

  NodeGroup:
    Type: AWS::EKS::Nodegroup
    DependsOn: EKSCluster
    Properties:
      ClusterName: !Ref ClusterName
      NodeRole: !GetAtt NodeInstanceRole.Arn
      Subnets:
        - !Ref PrivateSubnet1Id
        - !Ref PrivateSubnet2Id
      InstanceTypes:
        - !Ref NodeInstanceType
      ScalingConfig:
        MinSize: !Ref NodeGroupMinSize
        DesiredSize: !Ref NodeGroupDesiredSize
        MaxSize: !Ref NodeGroupMaxSize

  # OIDC provider - required for IRSA (e.g. AWS Load Balancer Controller in Phase 4.8)
  EKSOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: !GetAtt EKSCluster.OpenIdConnectIssuerUrl
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 9e99a48a9960b14926bb7f3b02e22da2b0ab7280

Outputs:
  ClusterName:
    Value: !Ref EKSCluster
  ClusterEndpoint:
    Value: !GetAtt EKSCluster.Endpoint
  OIDCIssuerUrl:
    Value: !GetAtt EKSCluster.OpenIdConnectIssuerUrl
  NodeInstanceRoleArn:
    Value: !GetAtt NodeInstanceRole.Arn
